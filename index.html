<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaunchPoint RISE</title>
<meta name="description" content="LaunchPoint RISE - Financial Literacy as a Service for banks, credit unions, and dealerships." />
<style>
  html, body { margin: 0; height: 100%; background: #f5f1e8; color: #5a6678; font-family: system-ui, -apple-system, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .loading {
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #6a7688;
    opacity: 0;
    animation: fade-in 0.6s ease-out 0.3s forwards;
  }
  @keyframes fade-in { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .loading { animation: none; opacity: 0.6; } }
</style>
</head>
<body>
<div class="loading" role="status" aria-live="polite">Loading&hellip;</div>

<!--
  LaunchPoint RISE — hostname-based router

  Routes:
    launchpointrise.com / www.launchpointrise.com   ->  /marketing.html
    <sub>.launchpointrise.com  where <sub> in partners.json   ->  /product.html
    <sub>.launchpointrise.com  where <sub> NOT in partners.json   ->  /not-found.html

  Local development / preview:
    Any non-launchpointrise.com hostname defaults to /marketing.html.
    Override with ?view=marketing|product|not-found for testing.
-->
<script>
(function () {
  var APEX_DOMAIN = 'launchpointrise.com';
  var APEX_HOSTS = [APEX_DOMAIN, 'www.' + APEX_DOMAIN];

  var hostname = (window.location.hostname || '').toLowerCase();
  var params = new URLSearchParams(window.location.search);
  var viewOverride = params.get('view');

  function go(path) {
    window.location.replace(path + window.location.search + window.location.hash);
  }

  // Explicit override (dev / preview / sharing a specific view)
  if (viewOverride === 'marketing') return go('/marketing.html');
  if (viewOverride === 'product')   return go('/product.html');
  if (viewOverride === 'not-found') return go('/not-found.html');

  // Apex / www -> marketing
  if (APEX_HOSTS.indexOf(hostname) !== -1) {
    return go('/marketing.html');
  }

  // Subdomain of launchpointrise.com -> look up in partners.json
  if (hostname.length > APEX_DOMAIN.length + 1 && hostname.slice(-(APEX_DOMAIN.length + 1)) === '.' + APEX_DOMAIN) {
    var sub = hostname.slice(0, hostname.length - APEX_DOMAIN.length - 1);
    if (!sub || sub === 'www') return go('/marketing.html');

    fetch('/partners.json', { cache: 'default' })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .catch(function () { return {}; })
      .then(function (partners) {
        if (partners && Object.prototype.hasOwnProperty.call(partners, sub)) {
          go('/product.html');
        } else {
          go('/not-found.html');
        }
      });
    return;
  }

  // Anything else (localhost, file://, htmlpreview, IP, etc.) -> marketing by default
  go('/marketing.html');
})();
</script>
</body>
</html>
